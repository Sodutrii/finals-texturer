# Publishes finals_texturer-<version>.zip as a GitHub Release whenever a push
# to main carries an add-on version that has no release yet.
# The version comes from finals_texturer/blender_manifest.toml.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "finals_texturer/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import re, tomllib
          with open("finals_texturer/blender_manifest.toml", "rb") as f:
              v = tomllib.load(f)["version"]
          src = open("finals_texturer/__init__.py", encoding="utf-8").read()
          m = re.search(r'"version"\s*:\s*\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)\)', src)
          bl = ".".join(m.groups()) if m else None
          if bl != v:
              raise SystemExit(f"Version mismatch: manifest {v}, bl_info {bl}")
          print(f"version={v}")
          EOF

      - name: Skip if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.version }} already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.exists == 'false'
        with:
          dotnet-version: "10.0.x"

      - name: Build exporter
        if: steps.check.outputs.exists == 'false'
        # Export Now's helper (exporter/), for Windows, using the .NET runtime FModel already needs
        run: |
          dotnet publish exporter/FtExporter.csproj -c Release -r win-x64 --self-contained false \
            -p:DebugType=none -o finals_texturer/bin/exporter
          test -f finals_texturer/bin/exporter/ft_exporter.exe

      - name: Build zip
        if: steps.check.outputs.exists == 'false'
        run: |
          python - <<'EOF'
          # Same layout as `blender --command extension build`: add-on files at the zip root.
          import pathlib, zipfile
          src = pathlib.Path("finals_texturer")
          out = pathlib.Path("finals_texturer-${{ steps.ver.outputs.version }}.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(src.rglob("*")):
                  rel = p.relative_to(src)
                  if p.is_dir() or any(part.startswith(".") or part == "__pycache__" for part in rel.parts):
                      continue
                  if p.suffix in (".pyc", ".pyo", ".blend1"):
                      continue
                  z.write(p, rel.as_posix())
          print(out, [n for n in zipfile.ZipFile(out).namelist()])
          EOF

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" "finals_texturer-$v.zip" \
            --title "Finals Texturer $v" \
            --target "${{ github.sha }}" \
            --generate-notes
